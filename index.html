<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大圣 · 劫后行 | Black Lotus</title><meta name="description" content="一棍破局，一念重来。可离线运行的像素横版动作肉鸽。"><link rel="stylesheet" href="src/style.css"><link rel="stylesheet" href="src/v2.css"><link rel="stylesheet" href="src/dialogs.css"><link rel="stylesheet" href="src/combat.css"><link rel="stylesheet" href="src/progression.css"><link rel="stylesheet" href="src/journey.css"><link rel="stylesheet" href="src/heroes.css"><link rel="stylesheet" href="src/equipped-hud.css"><link rel="stylesheet" href="src/signature.css"><link rel="stylesheet" href="src/challenge.css"><link rel="stylesheet" href="src/realms.css"><link rel="stylesheet" href="src/celestial.css"><link rel="stylesheet" href="src/campaign.css"><link rel="stylesheet" href="src/cloud-visual.css"><link rel="stylesheet" href="src/combat-feedback.css"></head>
<body>
  <main id="app">
    <header class="masthead"><a href="#" id="brand" aria-label="大圣劫后行主菜单"><span class="brand-seal">悟</span><span>大圣 <i>／</i> 劫后行</span></a><span class="edition">A PIXEL PILGRIMAGE <span class="tiny-star">✦</span> 独立离线版</span><button id="guide-top" class="text-button">行者手记 <span>↗</span></button></header>
    <section id="stage" aria-label="横版游戏区域">
      <canvas id="world" width="960" height="540" tabindex="0" aria-label="游戏世界。A D移动，空格跳跃，J主武器，H副武器，K闪避，L分身，U伸棍或风火轮，R法天象地，Q符术，C秘技，F交互，B查看加成，Escape暂停。"></canvas>
      <div id="vignette" aria-hidden="true"></div>
      <div id="world-labels" hidden></div><div id="hud" hidden>
        <div class="hud-left">
          <div class="vitals"><div class="vital-head"><strong id="player-name">孙悟空</strong><span id="hp-number">100 / 100</span></div><div class="meter hp"><i id="hp-fill"></i></div><div class="focus-line"><span>定力</span><div class="meter focus"><i id="focus-fill"></i></div><b id="focus-number">65</b></div><div class="focus-line rage-line" id="rage-line"><span id="ultimate-name">R 法天象地</span><div class="meter"><i id="rage-fill"></i></div><b id="rage-number">25</b></div></div>
          <div class="signature-line"><span id="signature-name">U 如意伸缩</span><div class="meter"><i id="signature-fill"></i></div><b id="signature-state">就绪</b></div>
          <div id="combat-state" aria-live="off"></div><section class="equipped-hud" aria-label="当前已选加成">
            <div class="equipped-heading"><span>已选加成</span><small>B 详情</small></div>
            <dl>
              <div class="equipped-row"><dt>舍利</dt><dd id="relic-list"></dd></div>
              <div class="equipped-row"><dt>法门</dt><dd id="growth-state"></dd></div>
              <div class="equipped-row"><dt>秘技</dt><dd id="art-state">C 未习秘技</dd></div><div class="equipped-row"><dt>符术</dt><dd id="talisman-state">Q 未携符术</dd></div>
            </dl>
          </section>
        </div>
        <div class="journey"><small id="chapter">第一境</small><strong id="stage-name">雾隐山道</strong><span id="objective">破除黑莲阵眼 0 / 2</span><div class="journey-progress"><i id="journey-fill"></i></div></div>
        <div class="hud-actions"><span id="run-seed"></span><button id="build-open" aria-label="查看本局法门">本局法门 <span>B</span></button><button id="pause" aria-label="暂停游戏">Ⅱ <span>ESC</span></button></div>
        <div id="boss-hud" hidden><span><b id="boss-name">无天</b><em id="boss-phase">黑莲横世</em></span><div class="meter"><i id="boss-fill"></i></div></div>
        <div class="run-bottom"><span id="range-state"></span><span id="dash-state"></span></div>
      </div>
      <div id="overlay"></div>
      <div id="combat-labels" aria-hidden="true"></div>
      <div id="toast" role="status" aria-live="polite" hidden></div>
      <div id="context-hint" hidden></div>
    </section>
    <footer class="footline"><div><span class="status-dot"></span><span id="storage-status">离线可玩 · 进度自动保存</span></div><div class="keystrip"><span><kbd>A</kbd><kbd>D</kbd> 行走</span><span><kbd>SPACE</kbd> 跃起</span><span><kbd>J</kbd> 攻击</span><span><kbd>K</kbd> 闪避</span><span><kbd>H</kbd> 副武器</span><span><kbd>L</kbd> 神通</span><span><kbd>R</kbd> 大招</span><span><kbd>C</kbd> 秘技</span><span><kbd>Q</kbd> 符术</span><span><kbd>U</kbd> 变化</span></div><span class="build">v12.1.3 <span>／</span> 棍影 · 回环 · 应劫</span></footer>
    <input id="import-file" type="file" accept="application/json,.json" hidden>
  </main>
  <script src="src/content.js"></script><script src="src/motion.js"></script><script src="src/world.js"></script><script src="src/progression.js"></script><script src="src/journey.js"></script><script src="src/heroes.js"></script><script src="src/signature.js"></script><script src="src/simulation.js"></script><script src="src/challenge.js"></script><script src="src/realms.js"></script><script src="src/warriors.js"></script><script src="src/celestial.js"></script><script src="src/campaign-data.js"></script><script src="src/enemy-effects.js"></script><script src="src/route-layouts.js"></script><script src="src/campaign-world.js"></script><script src="src/campaign-combat.js"></script><script src="src/campaign-state.js"></script><script src="src/storage.js"></script><script src="src/renderer.js"></script><script src="src/art.js"></script><script src="src/art-catalog.js"></script><script src="src/generated-art.js"></script><script src="src/visuals.js"></script><script src="src/combat-art.js"></script><script src="src/progression-art.js"></script><script src="src/journey-art.js"></script><script src="src/hero-art.js"></script><script src="src/map-data.js"></script><script src="src/realm-dressing-data.js"></script><script src="src/map-art.js"></script><script src="src/scene-data.js"></script><script src="src/scene-art.js"></script><script src="src/signature-data.js"></script><script src="src/signature-art.js"></script><script src="src/challenge-art.js"></script><script src="src/actor-states-data.js"></script><script src="src/actor-repair-data.js"></script><script src="src/actor-state-art.js"></script><script src="src/dialog-art.js"></script><script src="src/v8-art-data.js"></script><script src="src/v8-art.js"></script><script src="src/celestial-art-data.js"></script><script src="src/celestial-art.js"></script><script src="src/campaign-art-data.js"></script><script src="src/audit-art-data.js"></script><script src="src/campaign-art.js"></script><script src="src/enemy-marker-data.js"></script><script src="src/enemy-marker-art.js"></script><script src="src/cloud-visual-data.js"></script><script src="src/cloud-visuals.js"></script><script src="src/combat-feedback-data.js"></script><script src="src/combat-feedback-art.js"></script><script src="src/motion-data.js"></script><script src="src/motion-art.js"></script><script src="src/enemy-effects-data.js"></script><script src="src/enemy-effects-art.js"></script><script src="src/input.js"></script><script src="src/generated-audio.js"></script><script src="src/generated-music.js"></script><script src="src/music.js"></script><script src="src/audio.js"></script><script src="src/app.js"></script>
</body></html>
