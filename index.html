  <main id="app">

    <section id="stage" aria-label="横版游戏区域">
      <canvas id="world" width="960" height="540" tabindex="0" aria-label="游戏世界。A D移动，空格跳跃，J主武器，H副武器，K闪避，L分身，U伸棍或风火轮，R法天象地，Q符术，C秘技，F交互，B查看加成，Escape暂停。"></canvas>
      <div id="vignette" aria-hidden="true"></div>
      <div id="world-labels" hidden></div><div id="hud" hidden>
        <div class="hud-left">
          <div class="vitals"><div class="vital-head"><strong id="player-name">孙悟空</strong><span id="hp-number">100 / 100</span></div><div class="meter hp"><i id="hp-fill"></i></div><div class="focus-line"><span>定力</span><div class="meter focus"><i id="focus-fill"></i></div><b id="focus-number">65</b></div><div class="focus-line rage-line" id="rage-line"><span id="ultimate-name">R 法天象地</span><div class="meter"><i id="rage-fill"></i></div><b id="rage-number">25</b></div></div>
          <div class="signature-line"><span id="signature-name">U 如意伸缩</span><div class="meter"><i id="signature-fill"></i></div><b id="signature-state">就绪</b></div>
          <div id="combat-state" aria-live="off"></div><section class="equipped-hud" aria-label="当前已选加成">
            <div class="equipped-heading"><span>已选加成</span><small>B 详情</small></div>
            <dl>
              <div class="equipped-row"><dt>舍利</dt><dd id="relic-list"></dd></div>
              <div class="equipped-row"><dt>法门</dt><dd id="growth-state"></dd></div>
              <div class="equipped-row"><dt>秘技</dt><dd id="art-state">C 未习秘技</dd></div><div class="equipped-row"><dt>符术</dt><dd id="talisman-state">Q 未携符术</dd></div>
            </dl>
          </section>
        </div>
        <div class="journey"><small id="chapter">第一境</small><strong id="stage-name">雾隐山道</strong><span id="objective">破除黑莲阵眼 0 / 2</span><div class="journey-progress"><i id="journey-fill"></i></div></div>
        <div class="hud-actions"><span id="run-seed"></span><button id="build-open" aria-label="查看本局法门">本局法门 <span>B</span></button><button id="pause" aria-label="暂停游戏">Ⅱ <span>ESC</span></button></div>
        <div id="boss-hud" hidden><div class="boss-heading"><b id="boss-name">无天</b><span id="boss-health"></span></div><div class="boss-bar"><div id="boss-meter" class="meter" role="meter" aria-label="首领生命" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i id="boss-fill"></i></div></div><em id="boss-phase">黑莲横世</em></div>
        <div class="run-bottom"><span id="range-state"></span><span id="dash-state"></span></div>
      </div>
      <div id="overlay"></div>
      <div id="combat-labels" aria-hidden="true"></div>
      <div id="toast" role="status" aria-live="polite" hidden></div>
      <div id="context-hint" hidden></div>
      <button id="fullscreen" type="button" aria-label="全屏游戏" aria-pressed="false" title="全屏游戏（F10）"><span id="fullscreen-label">全屏</span></button>
    </section>
    <footer class="footline"><div><span class="status-dot"></span><span id="storage-status">离线可玩 · 进度自动保存</span></div><div class="keystrip"><span><kbd>A</kbd><kbd>D</kbd> 行走</span><span><kbd>SPACE</kbd> 跃起</span><span><kbd>J</kbd> 攻击</span><span><kbd>K</kbd> 闪避</span><span><kbd>H</kbd> 副武器</span><span><kbd>L</kbd> 神通</span><span><kbd>R</kbd> 大招</span><span><kbd>C</kbd> 秘技</span><span><kbd>Q</kbd> 符术</span><span><kbd>U</kbd> 变化</span></div><span class="build">v12.4.1 <span>／</span> 棍影 · 回环 · 应劫</span></footer>
    <input id="import-file" type="file" accept="application/json,.json" hidden>
  </main>
