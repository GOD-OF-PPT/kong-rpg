  function pauseMenu(){ $('overlay').innerHTML=`<section class="panel" style="max-width:650px" aria-label="暂停菜单"><div class="eyebrow">暂歇 · 棍心不息</div><h2>风停在这一刻</h2><p class="subtitle">${K.STAGES[state.stage].name} · 因缘 ${esc(state.seed)}<br>${state.relics.map(id=>K.relic(id).name).join(' / ')}</p><div class="actions">${button('continue','继续前行',true)}${button('help','行者手记')}</div><div class="setting-row"><label for="volume">声音</label><input id="volume" aria-label="音量" type="range" min="0" max="100" value="${settings.volume*100}"><label><input id="shake" type="checkbox" ${settings.shake?'checked':''}> 屏幕震动</label></div><div class="actions">${button('export','导出存档')}${button('import','导入存档')}${button('main-menu','回到主菜单')}</div><p class="notice">旧旅程保留原版战斗，新开局启用读招修正。本地 HTTP 与双击入口的自动存档各自独立。导出 JSON 可在两者间带走进度。</p></section>`;listen('continue',resume);listen('help',()=>{backScreen='paused';updateScreen('help');});listen('export',()=>{save();storage.export(state,meta);toast('已导出，保留这份 JSON 可随时恢复。');});listen('import',()=>$('import-file').click());listen('main-menu',()=>{save();updateScreen('menu');});$('volume').oninput=e=>{settings.volume=Number(e.target.value)/100;audio.setVolume(settings.volume);};$('shake').onchange=e=>{settings.shake=e.target.checked;renderer.shake=settings.shake;};}
  function help(){ $('overlay').innerHTML=`<section class="panel" aria-label="行者手记"><div class="eyebrow">行者手记 · 看清再出手</div><h2>棍有尽处，变化无穷</h2><div class="help-grid"><div><h3>步法与落点</h3><p>A / D 或方向键移动。空格 / W 跳跃，松开缩短跳高；踩敌可反弹。腾云骨允许再按一次空格空中跳。脚下亮边才是落脚面；S＋空格可向下穿过悬台。</p></div><div><h3>棍法与下劈</h3><p>J 或鼠标左键三连，第三棍更重、收招更慢。空中按 S＋J 下劈。定海心的第三棍可破盾；普通棍法要绕背或从上方进攻。</p></div><div><h3>闪避与分身</h3><p>K / Shift 闪避，有 0.85 秒冷却；短暂无敌。L / 右键分身消耗 40 定力，诱敌并攻击。棍击命中积攒定力；照影珠消耗 50、持续更久。</p></div><div><h3>识敌与破阵</h3><p>执刃魔兵举刀后会完成斩击，轻棍不会冻结预警；可跳避或以重棍打断。重盾兵正面格挡、转身较慢；悬空莲灯使会瞄准施法。先看亮起的预警，再跳跃、绕背或交闪避。</p></div><div><h3>三境与黑莲</h3><p>每境打碎两座紫色阵眼，到最右山门按 E；可绕过敌人。每次过境恢复 18 生命，并选一枚舍利。三境后直面无天：护体时无法造成伤害，金光收招时才是破绽；横扫可跳，散射可闪。</p></div><div><h3>因缘与重来</h3><p>相同种子复现路线、敌人与奖励。不同舍利改变解法。坠落失去 18 生命后回到近处安全落点；死亡只清空本局，不靠永久属性磨过。</p></div></div><div class="actions">${button('close-help','记下了',true)}${button('import','导入存档')}</div><p class="notice">Esc 随时暂停。分身、奖励和界面都使用同一个游戏状态；菜单打开时战斗停止。</p></section>`;listen('close-help',()=>updateScreen(backScreen));listen('import',()=>$('import-file').click());}
  function reward(){save();$('overlay').innerHTML=`<section class="panel" aria-label="过境奖励"><div class="eyebrow">第${['一','二','三'][state.stage]}境已破 · 舍利余光</div><h2>下一程，如何破局？</h2><p class="subtitle">山门将启。生命恢复 18，定力恢复 20。选一枚舍利带往${K.STAGES[state.stage+1].name}。</p>${cards(state.reward)}<p class="starter-note">按 1 / 2 / 3 选择 · 已有：${state.relics.map(id=>K.relic(id).name).join(' / ')}</p></section>`;for(const b of $('overlay').querySelectorAll('[data-relic]'))b.onclick=()=>choose(b.dataset.relic);}
  function choose(id){if(K.choose(state,id)){renderer.camera=0;audio.event({type:'relic'});updateScreen('playing');toast(K.STAGES[state.stage].subtitle);save();}}
  function ending(){const won=state.mode==='won';if(!settled){settled=true;if(won)meta.wins++;meta.best=Math.max(meta.best,won?4:state.stage);save();}const seconds=Math.floor(state.time),time=Math.floor(seconds/60)+'分'+seconds%60+'秒';$('overlay').innerHTML=`<section class="panel" style="max-width:720px" aria-label="${won?'胜利结算':'失败结算'}"><div class="eyebrow">${won?'黑莲已散 · 此心长明':'劫途未尽 · 再起一念'}</div><h2>${won?'三界重见微光':'此身暂歇，棍心未折'}</h2><p class="subtitle">${won?'无天的黑莲散作尘埃。你握紧金箍棒，走向重新亮起的灯火。<br>这一回，你以自己的解法破了此劫。':'最后受伤：'+esc(state.lastDamage)+'。<br>再走一次相同因缘，换一种舍利，试试另一条路。'}</p><div class="results"><div><small>行走</small><b>${time}</b></div><div><small>破阵</small><b>${state.broken} / 6</b></div><div><small>退敌</small><b>${state.kills}</b></div><div><small>因缘</small><b style="font-size:16px">${esc(state.seed)}</b></div></div><p class="subtitle">此行舍利：${state.relics.map(id=>K.relic(id).name).join(' / ')}</p><div class="actions">${button('retry','同缘再行',true)}${button('new-path','另启因缘')}${button('export','导出此行')}</div></section>`;listen('retry',()=>{K.pendingSeed=state.seed;updateScreen('start');});listen('new-path',()=>updateScreen('menu'));listen('export',()=>storage.export(state,meta));}
  function control(action){if(action==='pause'){if(screen==='playing'){state.mode='paused';save();updateScreen('paused');}else if(screen==='paused')resume();else if(screen==='help')updateScreen(backScreen);}if(action==='blur'&&screen==='playing'){state.mode='paused';save();updateScreen('paused');}}
  listen('pause',()=>control('pause'));listen('guide-top',()=>{if(screen==='playing'){state.mode='paused';save();}backScreen=state&&screen!=='menu'&&screen!=='start'?'paused':'menu';updateScreen('help');});listen('brand',e=>{e.preventDefault();if(screen==='playing'){state.mode='paused';save();}updateScreen('menu');});
  $('import-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=storage.import(await file.text());state=data.state;meta=data.meta;settled=['dead','won'].includes(state.mode);renderer.camera=K.clamp(state.player.x-300,0,state.room.width-960);save();updateScreen(state.mode);toast('存档已恢复，继续前行。');}catch(err){toast('导入失败：'+err.message);}e.target.value='';};
  window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if((screen==='start'||screen==='reward')&&/^Digit[123]$/.test(e.code)){const i=Number(e.code.slice(-1))-1;const ids=screen==='start'?['cloud','echo','staff']:state.reward;if(ids[i]){e.preventDefault();audio.unlock();screen==='start'?startRun(ids[i]):choose(ids[i]);}}if(e.code==='Tab'&&screen!=='playing'){const nodes=[...$('overlay').querySelectorAll('button:not(:disabled),input:not([hidden])')];if(nodes.length){const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}});
  window.addEventListener('beforeunload',save);
  K.pointerFace=x=>{const rect=world.getBoundingClientRect();const wx=(x-rect.left)/rect.width*960+renderer.camera;return Math.sign(wx-state.player.x-12);};
  function hud(){if(!state)return;const p=state.player;$('hp-number').textContent=Math.ceil(p.hp)+' / 100';$('hp-fill').style.width=p.hp+'%';$('focus-number').textContent=Math.floor(p.focus);$('focus-fill').style.width=p.focus+'%';$('chapter').textContent=state.stage<3?'第'+['一','二','三'][state.stage]+'境':'终局';$('stage-name').textContent=K.STAGES[state.stage].name;$('objective').textContent=state.stage<3?'破除黑莲阵眼 '+state.room.seals.filter(q=>q.hp===0).length+' / 2':'护体时避让 · 金光时出棍';$('run-seed').textContent=state.seed;$('relic-list').textContent=state.relics.map(id=>K.relic(id).name).join(' · ');$('dash-state').textContent=p.dashCD>0?'闪避恢复 '+p.dashCD.toFixed(1)+'s':'闪避就绪';$('boss-hud').hidden=state.stage!==3;const boss=state.room.enemies.find(e=>e.kind==='boss');if(boss){$('boss-fill').style.width=boss.hp/boss.maxHp*100+'%';$('boss-phase').textContent=boss.phase==='recover'?'破绽已现':boss.phase==='sweep-windup'?'横扫将至 · 跳':boss.phase==='orb-windup'?'莲焰将至 · 闪':'黑莲横世';}
    const near=state.stage<3&&Math.abs(p.x-state.room.exit)<85;$('context-hint').hidden=screen!=='playing'||(!near&&state.time>12);$('context-hint').textContent=near?(state.room.seals.some(q=>q.hp>0)?'阵眼尚存，回身破阵':'按 E 穿过山门，选择舍利'):'A D 行走 · 长按空格高跳 · J 三连 · K 闪避 · L 分身';
  }
  let previous=performance.now(),accumulator=0,lastHud=0;
  function frame(now){try{const elapsed=Math.min((now-previous)/1000,.1);if(screen==='playing'){metrics.frames.push(now-previous);if(metrics.frames.length>10000)metrics.frames.shift();}previous=now;accumulator+=elapsed;const willStep=screen==='playing'&&accumulator>=K.DT&&state.hitstop<=0;let actions=willStep?input.read():{};let guard=0;
    if(screen==='playing')while(accumulator>=K.DT&&guard++<13){K.step(state,actions);actions={...actions,jumpPressed:false,dashPressed:false,clonePressed:false,interactPressed:false};for(const event of state.events){audio.event(event);if(event.type==='hurt')toast(event.source+' · -'+event.amount+' 生命');if(event.type==='seal')toast('阵眼已破 · '+state.room.seals.filter(q=>q.hp===0).length+' / 2');if(event.type==='empty-focus')toast('定力不足，用棍击命中来积攒。');if(event.type==='gate-locked')toast('还有黑莲阵眼未破。');if(event.type==='room')meta.best=Math.max(meta.best,state.stage);}accumulator-=K.DT;if(state.mode!=='playing'){updateScreen(state.mode);break;}}
    else accumulator=0;
    renderer.draw(state,screen,elapsed);const submitted=performance.now();if(willStep){for(const q of pendingInputs){metrics.inputs.push({code:q.code,ms:+(submitted-q.t).toFixed(3),eventMs:+(submitted-q.eventTime).toFixed(3)});}pendingInputs=[];}if(metrics.inputs.length>1000)metrics.inputs.splice(0,metrics.inputs.length-1000);
    audio.tick(screen==='playing');if(now-lastHud>80){hud();lastHud=now;}if(now>toastUntil)$('toast').hidden=true;if(state&&screen==='playing'&&now-lastSave>3000)save();
  }catch(e){metrics.errors.push(String(e.stack||e));toast('运行异常，请导出存档并重新打开。');console.error(e);if(state){state.mode='paused';updateScreen('paused');}}
    requestAnimationFrame(frame);
  }
  Object.defineProperty(window,'__KONG__',{value:Object.freeze({snapshot:()=>state?JSON.parse(JSON.stringify({screen,state,meta,camera:renderer.camera})):({screen,state:null,meta}),metrics:()=>JSON.parse(JSON.stringify(metrics)),version:K.VERSION})});
  renderer.shake=settings.shake;if(storage.error)toast('自动存档未能读取，可通过手记导入 JSON。');updateScreen('menu');requestAnimationFrame(frame);
})(globalThis.Kong ||= {});

</script>
